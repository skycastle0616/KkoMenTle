name: daily

on:
  schedule:
    # UTC 15:05 = KST 00:05. 정답은 KST 자정에 바뀐다.
    # Actions cron 은 수십 분 늦을 수 있는데, build.py 의 신선도 검증이 있어서 무해하다.
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 오늘 회차 빌드
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build.py --out docs

      - name: 변경 있으면 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "build: $(TZ=Asia/Seoul date +%F) [skip ci]"
            git push
          fi
