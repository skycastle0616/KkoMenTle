name: daily

on:
  schedule:
    # UTC 15:05 = KST 00:05. 정답은 KST 자정에 바뀐다.
    # Actions cron 은 수십 분 늦을 수 있는데, build.py 의 신선도 검증이 있어서 무해하다.
    - cron: '5 15 * * *'
  workflow_dispatch:

# GITHUB_TOKEN 으로 만든 커밋은 다른 워크플로를 트리거하지 않는다. 그래서 브랜치 기반
# Pages 는 이 커밋에 반응하지 않는다. 배포까지 이 워크플로가 직접 한다.
# → Settings → Pages → Source 는 "GitHub Actions" 여야 한다.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 오늘 회차 빌드
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build.py --out docs

      # 배포는 아티팩트로 하지만, docs/data/*.json 은 커밋해야 다음 날 기록이 쌓인다.
      - name: 기록 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "build: $(TZ=Asia/Seoul date +%F) [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
